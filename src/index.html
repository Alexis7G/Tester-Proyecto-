<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TAVOX LCH</title>
<style>
:root{--bg:#07040f;--card:rgba(255,255,255,.05);--line:rgba(255,255,255,.1);--tx:#f5f3ff;--mut:#9d93b8;--c1:#22d3ee;--c2:#a855f7;--c3:#f43f5e;--g:linear-gradient(120deg,#22d3ee,#a855f7 55%,#f43f5e);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif,system-ui,sans-serif}
body{height:100%;background:#030208;color:var(--tx);overflow:hidden;position:relative}
button{cursor:pointer;color:inherit;border:none;background:none;user-select:none}
svg{flex:none}
#stage{position:absolute;left:50%;top:50%;width:1100px;height:700px;transform-origin:center}
.app{width:100%;height:100%;border-radius:28px;border:1px solid var(--line);overflow:hidden;position:relative;background:linear-gradient(160deg,#150a26,#07040f 60%,#06222b)}
.hd{position:absolute;top:0;left:0;right:0;height:64px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;z-index:3}
.brand{display:flex;align-items:center;gap:12px;font:800 20px system-ui,sans-serif;letter-spacing:1px}.brand img{width:36px;height:36px;border-radius:12px;object-fit:cover;box-shadow:0 0 18px #a855f7aa}.brand span{background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.accb{display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:13px}
.bd{font-size:9px;padding:2px 7px;border-radius:5px;font-weight:800;background:var(--g);color:#fff}
.view{position:absolute;top:64px;left:0;right:0;bottom:0;overflow-y:auto;padding:6px 28px 120px}
.view::-webkit-scrollbar{width:6px}.view::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
h1{font:800 28px system-ui,sans-serif}h2{font:700 15px system-ui,sans-serif;margin:22px 0 12px;color:#e9d5ff}.sub{color:var(--mut);font-size:14px;margin-top:4px}
.dock{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:9px 14px;border-radius:30px;background:rgba(18,10,32,.8);border:1px solid var(--line);z-index:4;box-shadow:0 10px 40px #000a}
.nb{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;color:var(--mut);transition:.2s;position:relative}
.nb:hover{color:#fff;background:var(--card);transform:translateY(-3px)}.nb.on{color:#fff;background:linear-gradient(135deg,#22d3ee33,#a855f755);box-shadow:inset 0 0 0 1px #a855f788}
.nb:hover:after{content:attr(data-l);position:absolute;bottom:60px;font:600 11px system-ui,sans-serif;background:#000c;padding:4px 9px;border-radius:7px;white-space:nowrap;color:#fff}
.play{width:68px;height:68px;border-radius:50%;background:var(--g);display:grid;place-items:center;margin:0 12px;transform:translateY(-14px);box-shadow:0 0 30px #a855f7cc,0 0 60px #22d3ee55;transition:.2s}.play:hover{transform:translateY(-17px) scale(1.07)}
.stats{display:flex;gap:12px;margin-top:16px}.st{flex:1;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:12px}.st b{font:800 20px system-ui,sans-serif;display:block}.st small{color:var(--mut);font-size:11px}
.ib{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#22d3ee33,#a855f755);color:#c4b5fd}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.ic{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px 14px 14px;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;transition:.2s;cursor:pointer}
.ic:hover{transform:translateY(-4px);border-color:#a855f7aa;box-shadow:0 12px 30px #a855f733}
.ic b{font:700 14px system-ui,sans-serif}.ic small{color:var(--mut);font-size:11px}
.ed{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:9px;background:#0008;display:grid;place-items:center;opacity:0;transition:.2s;color:#fff}.ic:hover .ed{opacity:1}
.ic.add{border-style:dashed;justify-content:center;color:var(--mut);min-height:156px}
.btn{padding:9px 16px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:6px}.btn.ac{background:var(--g);border:none}.btn.ok{color:#67e8f9;border-color:#22d3ee55}
.ck{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:8px}.ck:hover{border-color:#22d3ee77}
.ck p{color:var(--mut);font-size:12px;min-height:32px;line-height:1.4}.ck b{font:700 14px system-ui,sans-serif}
.tile{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;color:#fff;box-shadow:0 6px 18px var(--s,#0006)}
.prog{height:6px;border-radius:4px;background:var(--line);overflow:hidden}.prog i{display:block;height:100%;background:var(--g)}
.chs{display:flex;gap:8px;margin:16px 0;align-items:center;flex-wrap:wrap}
.ch{padding:8px 16px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--mut);display:inline-flex;gap:6px;align-items:center}.ch.on{color:#fff;background:linear-gradient(135deg,#22d3ee33,#a855f755);border-color:#a855f7aa}
input[type=text]{background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:14px;padding:10px 14px;color:#fff;font-size:13px;outline:none;user-select:text;-webkit-user-select:text}input[type=text]:focus{border-color:var(--c1)}
.row{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:11px 14px;margin-bottom:9px}.row .n{flex:1;font-weight:700;font-size:14px}.row small{display:block;color:var(--mut);font-size:11px;font-weight:500;margin-top:2px}.row.off .n{opacity:.4}
.sw{width:42px;height:23px;border-radius:12px;background:#3f3a52;position:relative;flex:none;transition:.2s}.sw:after{content:"";position:absolute;left:3px;top:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:.2s}.sw.on{background:linear-gradient(90deg,#22d3ee,#a855f7)}.sw.on:after{left:22px}
.ih{display:flex;align-items:center;gap:18px;background:var(--card);border:1px solid var(--line);border-radius:26px;padding:20px;margin-top:8px}
.bigi{position:relative;cursor:pointer}.bigi .ed{opacity:1;top:-6px;right:-6px;background:var(--g)}
.srv{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 16px;margin-bottom:10px}.srv .n{flex:1}.srv b{font:700 14px system-ui,sans-serif}.srv small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.hw{display:flex;gap:16px}.screen{position:relative;flex:1;height:370px;border-radius:20px;border:1px solid var(--line);overflow:hidden;background:linear-gradient(#5a9bd8 0 52%,#4b8b3b 52% 60%,#6b4a2b 60%)}
.screen:after{content:"+";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:22px;color:#fff;opacity:.7;pointer-events:none}
.w{position:absolute;padding:5px 10px;border-radius:9px;background:rgba(0,0,0,.55);font-weight:800;font-size:12px;cursor:grab;border:1px solid transparent;touch-action:none;transform-origin:top left;z-index:2}.w:hover,.w.drag{border-color:var(--c1)}
.hp{width:220px;display:flex;flex-direction:column;gap:9px}.tg{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);padding:9px 12px;border-radius:12px;font-size:13px;font-weight:600}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700}input[type=range]{accent-color:#a855f7;width:100%}
select{background:rgba(0,0,0,.4);color:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;font-size:13px}
.set{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}.set .ck{gap:10px}
.modal{position:absolute;inset:0;background:rgba(3,2,8,.75);display:none;align-items:center;justify-content:center;z-index:9;background:#120a20;border:1px solid var(--line);border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:12px}.box h2{margin:0;font-size:19px}
.bg{padding:13px;border-radius:14px;font-weight:700;font-size:14px;background:var(--card);border:1px solid var(--line)}.bg.ms{background:linear-gradient(120deg,#2563eb,#7c3aed);border:none}
.pk{width:760px;max-height:620px}.pg{display:grid;grid-template-columns:repeat(11,1fr);gap:8px;overflow-y:auto;max-height:380px;padding:4px}
.pt{aspect-ratio:1;border-radius:14px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;transition:.15s;overflow:hidden}.pt:hover{border-color:var(--c1);transform:scale(1.08)}.pt.sel{border-color:var(--c3);box-shadow:0 0 0 2px #f43f5e66}.pt.up{border-style:dashed;color:var(--mut);cursor:pointer}
.empty{color:var(--mut);padding:36px;text-align:center}
.px{image-rendering:pixelated;display:block}.pt img{image-rendering:auto}*{box-shadow:none!important;transition:none!important;text-shadow:none!important}.pt.sel{outline:2px solid var(--c3)}
</style>
</head>

function servers(){return `<h1>Servidores</h1><div class="sub">Entra directo con un clic</div><h2></h2>${SRV.map((s,i)=>{const ms=15+Math.floor(Math.random()*75);return `<div class="srv">${tile('mods',i,46).replace(/<svg.*<\/svg>/,ic('globe',22))}<div class="n"><b>${s[0]}</b><small>${s[1]} · ${s[2].toLocaleString()} jugadores</small></div><b style="color:${ms<60?'#22d3ee':'#f59e0b'};font-size:13px">${ms} ms</b><button class="btn ac" data-q="${i}">Unirse</button></div>`}).join('')}`}
function hud(){const sc=S.scale;return `<h1>Personalizar HUD</h1><div class="sub" style="margin-bottom:16px">Arrastra los widgets sobre la pantalla</div><div class="hw"><div class="screen" id="screen">${S.hud.filter(w=>w.on).map(w=>`<div class="w" data-w="${w.id}" style="left:${w.x}px;top:${w.y}px;transform:scale(${sc});color:${S.col}">${w.t}</div>`).join('')}</div><div class="hp">${S.hud.map(w=>`<div class="tg">${w.t}<button class="sw ${w.on?'on':''}" data-hw="${w.id}"></button></div>`).join('')}<label class="f">Tamaño<input type="range" id="sc" min=".7" max="1.6" step=".05" value="${sc}"></label><label class="f">Color<input type="color" id="col" value="${S.col}" style="width:100%;height:32px;border:none;background:none"></label></div></div>`}
function set(){return `<h1>Ajustes</h1><div class="sub">Instancia: ${I().n}</div><div class="set"><div class="ck"><b>Memoria RAM · <span id="rv" style="color:#22d3ee">${S.ram} GB</span></b><input type="range" id="ram" min=".5" max="${S.maxRam||2}" step=".5" value="${S.ram}"><p>Con 2 GB de RAM en total: 1 GB para el juego y el resto para el sistema.</p></div><div class="ck"><b>Optimización JVM</b><select>${['PC modesto (SerialGC)','Optimizado (G1GC)','Máximo FPS (ZGC)'].map(o=>`<option>${o}</option>`).join('')}</select></div><div class="ck"><b>Versión y cargador</b><select id="ver">${['Fabric · 1.20.1','Fabric · 1.21.1','Forge · 1.20.1','Vanilla · 1.8.9'].map(o=>`<option ${o==I().ver?'selected':''}>${o}</option>`).join('')}</select></div><div class="ck" style="grid-column:1/3"><b>Perfil PC modesto · 2 GB RAM · gráficos integrados</b><p>Juego: 1 GB de RAM · distancia 6 chunks · gráficos Rápidos · partículas mínimas · sin sombras ni nubes · 60 FPS máx · 854×480.<br>Mods: Sodium + Lithium + FerriteCore + Entity Culling.</p><button class="btn ac" data-act="lowend" style="align-self:flex-start">${S.lowApplied?'✓ Aplicado':'Aplicar'}</button></div><div class="ck"><b>Cuenta</b><p>${S.acct?S.acct.n+(S.acct.p?' (Premium)':' (Offline)'):'Sin sesión'}</p><button class="btn ac" id="acct2" style="align-self:flex-start">Cambiar cuenta</button></div></div>`}
function render(){chrome();$('#view').innerHTML=({home,inst,explore,servers,hud,set})[S.v]();const q=$('#q');if(q)q.oninput=e=>{S.f=e.target.value;const p=e.target.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(p,p)}}
function go(v){S.v=v;S.f='';render()}
function grid(){const q=$('#pq').value.toLowerCase(),cu=S.profs[S.pick].icon,L=BL.filter(b=>b[0].toLowerCase().includes(q));
 $('#pg').innerHTML=`<label class="pt up" title="Subir imagen">${ic('up',20)}<input type="file" id="upl" accept="image/*" hidden></label>`+(q?'':`<button class="pt ${cu.t=='img'&&cu.s==LOGO?'sel':''}" data-ico="logo"><img src="${LOGO}" style="width:100%;height:100%;object-fit:cover"></button>`)+L.map(b=>`<button class="pt ${cu.t!='img'&&bn(cu)==b[0]?'sel':''}" data-ico="${b[0]}" title="${b[0]}"><img class="px" src="${blk(b[0])}" width="40" height="40"></button>`).join('');$('#pc').textContent=L.length+' iconos'}
function openPick(i){S.pick=i;$('#pq').value='';grid();$('#m3').classList.add('on')}
function dl(k,x){const id=k+x[0];S.dl[id]=0;const t=setInterval(()=>{S.dl[id]+=Math.random()*20+8;if(S.dl[id]>=100){clearInterval(t);delete S.dl[id];if(k=='packs')S.profs.push(mk(x[0],'Fabric · 1.20.1',{t:'c',c:COL[S.profs.length%6]}));else I()[k].push(k=='mods'?[x[0],'v1.0',1]:[x[0],1]);if(S.v=='explore')render()}else{const e=document.querySelector('[data-pb="'+id+'"]');if(e)e.style.width=Math.min(S.dl[id],100)+'%'}},400);render()}
function launch(i){if(i!==undefined)S.cur=i;if(!S.acct){$('#m1').classList.add('on');return}
 const st=['Verificando cuenta…','Descargando assets…','Preparando '+I().ver+'…','Aplicando optimizaciones…','Iniciando Minecraft…'];let n=0;$('#m2').classList.add('on');$('#pt').textContent='Lanzando '+I().n;
 const t=setInterval(()=>{$('#pb').style.width=((n+1)/st.length*100)+'%';$('#ps').textContent=st[n];n++;if(n>st.length){clearInterval(t);$('#m2').classList.remove('on');$('#pb').style.width=0}},700)}
document.addEventListener('click',e=>{const d=e.target.closest('button,[data-c],[data-v],#newp');if(!d)return;const D=d.dataset;
 if(D.pick!==undefined){e.stopPropagation();openPick(+D.pick)}
 else if(D.pl!==undefined)launch(+D.pl);
 else if(D.ico){const p=S.profs[S.pick];p.icon=D.ico=='logo'?{t:'img',s:LOGO}:{t:'b',k:D.ico};$('#m3').classList.remove('on');render()}
 else if(D.v)go(D.v);else if(D.c){S.cur=+D.c;S.v='inst';S.f='';render()}
 else if(D.go){S.ex=D.go;go('explore')}else if(D.ex){S.ex=D.ex;S.f='';render()}
 else if(D.tab){S.tab=D.tab;S.f='';render()}
 else if(D.get){const k=D.get.startsWith('packs')?'packs':D.get.startsWith('mods')?'mods':'shaders';dl(k,CAT[k].find(x=>k+x[0]==D.get))}
 else if(D.t){const x=I()[S.tab][+D.t];x[x.length-1]^=1;render()}
 else if(D.d){I()[S.tab].splice(+D.d,1);render()}
 else if(D.hw){const w=S.hud.find(z=>z.id==D.hw);w.on^=1;render()}
 else if(D.q!==undefined){S.acct?launch():$('#m1').classList.add('on')}
 else if(D.act=='lowend'){S.ram=1;S.lowApplied=1;render()}
 else if(D.act=='play')launch();
 else if(d.id=='ren'){const n=prompt('Nuevo nombre',I().n);if(n){I().n=n;render()}}
 else if(d.id=='newp'){const n=prompt('Nombre de la nueva instancia');if(n){S.profs.push(mk(n,'Fabric · 1.20.1',{t:'c',c:COL[S.profs.length%6]}));S.cur=S.profs.length-1;openPick(S.cur);render()}}
 else if(d.id=='pcl'||d.id=='pcn')$('#m3').classList.remove('on');
 else if(d.id=='acct'||d.id=='acct2')$('#m1').classList.add('on');
 else if(d.id=='mc')$('#m1').classList.remove('on');
 else if(d.id=='ms'){S.acct={n:'TavoxPlayer',p:1};$('#m1').classList.remove('on');render()}
 else if(d.id=='offb'){const n=$('#nick').value.trim();if(n.length<3){$('#nick').style.borderColor='#f43f5e';return}S.acct={n,p:0};$('#m1').classList.remove('on');render()}});
document.addEventListener('input',e=>{const i=e.target;
 if(i.id=='pq')grid();else if(i.id=='sc'){S.scale=+i.value;document.querySelectorAll('.w').forEach(w=>w.style.transform=`scale(${S.scale})`)}
 else if(i.id=='col'){S.col=i.value;document.querySelectorAll('.w').forEach(w=>w.style.color=S.col)}
 else if(i.id=='ram'){S.ram=+i.value;$('#rv').textContent=S.ram+' GB'}else if(i.id=='ver')I().ver=i.value});
document.addEventListener('change',e=>{if(e.target.id!='upl')return;const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d'),m=Math.min(im.width,im.height);x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,128,128);S.profs[S.pick].icon={t:'img',s:c.toDataURL('image/png')};$('#m3').classList.remove('on');render()};im.src=r.result};r.readAsDataURL(f)});
let dr=null;
document.addEventListener('pointerdown',e=>{const w=e.target.closest('.w');if(!w)return;const r=w.getBoundingClientRect();dr={w,ox:(e.clientX-r.left)/fit.k,oy:(e.clientY-r.top)/fit.k};w.classList.add('drag');w.setPointerCapture(e.pointerId)});
document.addEventListener('pointermove',e=>{if(!dr)return;const s=$('#screen').getBoundingClientRect(),k=fit.k;let x=(e.clientX-s.left)/k-dr.ox,y=(e.clientY-s.top)/k-dr.oy;x=Math.max(0,Math.min(x,s.width/k-dr.w.offsetWidth*S.scale));y=Math.max(0,Math.min(y,s.height/k-dr.w.offsetHeight*S.scale));dr.w.style.left=x+'px';dr.w.style.top=y+'px';const h=S.hud.find(z=>z.id==dr.w.dataset.w);h.x=x;h.y=y});
document.addEventListener('pointerup',()=>{if(dr){dr.w.classList.remove('drag');dr=null}});
function fit(){const k=Math.min(innerWidth/1120,innerHeight/720,1.4);fit.k=k;$('#stage').style.transform=`translate(-50%,-50%) scale(${k})`}
fit.k=1;addEventListener('resize',fit);fit();render();
</script>
<script>
// Puente con Tauri: solo actúa dentro de la app de escritorio
if(window.__TAURI__&&window.__TAURI__.core){
 window.__TAURI__.core.invoke('system_info').then(i=>{
  const gb=i.total_ram_mb/1024;
  S.maxRam=Math.max(1,Math.floor(gb*.75*2)/2);
  S.ram=Math.min(S.maxRam,Math.max(.5,Math.round(gb)/2));
  render();
 }).catch(console.error);
}
</script>
</body>
